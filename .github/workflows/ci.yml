name: Check public data and report vintages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python src/audit.py --output /tmp/surveillance-results
      - run: python src/public_audit.py --output /tmp/public-results
      - run: python src/vintage_audit.py --output /tmp/vintage-results
      - run: python src/validate_snapshot.py
